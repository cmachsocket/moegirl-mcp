[project]
name = "moegirl-mcp"
version = "0.2.0"
description = "MCP server exposing Moegirlpedia (萌娘百科) entry definitions for LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "mcp>=2.0",
  "requests>=2.32",
]

[project.scripts]
moegirl-mcp = "moegirl_mcp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moegirl_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
